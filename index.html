<style>
  :root{
    --ink:#16232e; --ink-soft:#4d6373;
    --paper:#e9edf0; --surface:#ffffff;
    --rule:#b9c5cd; --rule-soft:#d8e0e5;
    --hit:#0f6068; --hit-bg:#e2f0f0;
    --flag:#8a5300; --flag-bg:#fdf0d5; --flag-rule:#e2b871;
    --ref:#4a6fa5; --ref-bg:#e8eef7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:15px/1.5 "Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  .topbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--rule);
  }
  .seg{display:flex;border:1px solid var(--rule);background:var(--surface)}
  .seg button{
    border:0;background:transparent;color:var(--ink-soft);
    padding:5px 14px;font-size:12.5px;cursor:pointer;
  }
  .seg button+button{border-inline-start:1px solid var(--rule)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .seg-label{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-inline-end:2px;
  }
  .topbar .spacer{flex:1}

  header{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
    padding-bottom:14px;border-bottom:2px solid var(--ink);
  }
  h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
  .mark{
    width:26px;height:26px;flex:0 0 26px;color:var(--hit);
    align-self:center;
  }
  .mark svg{width:100%;height:100%;display:block}
  .eyebrow{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;
  }
  .sub{font-size:13px;color:var(--ink-soft);margin:10px 0 20px}

  .meter{margin:16px 0 22px}
  .meter-bar{
    display:flex;height:9px;background:var(--rule-soft);
    border:1px solid var(--rule);overflow:hidden;
  }
  .meter-hit{background:var(--hit);transition:width .3s ease}
  .meter-ref{background:var(--ref);opacity:.55;transition:width .3s ease}
  .meter-flag{background:var(--flag-rule);transition:width .3s ease}
  .meter-legend{
    display:flex;flex-wrap:wrap;gap:20px;margin-top:9px;
    font-size:11.5px;letter-spacing:.04em;color:var(--ink-soft);
  }
  .meter-legend b{color:var(--ink);font-variant-numeric:tabular-nums}
  .swatch{display:inline-block;width:9px;height:9px;
    margin-inline-end:6px;vertical-align:baseline;border:1px solid var(--rule)}

  .userflag{
    margin:0 0 18px;padding:9px 13px;font-size:13px;
    background:var(--flag-bg);border:1px solid var(--flag-rule);color:var(--flag);
  }

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}

  .panel{background:var(--surface);border:1px solid var(--rule)}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 13px;border-bottom:1px solid var(--rule);background:#f4f7f8;
  }
  .panel-title{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--ink-soft);
  }
  .he-label{
    font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;
    color:var(--ink);direction:rtl;unicode-bidi:isolate;margin-inline-start:5px;
  }

  textarea{
    width:100%;min-height:330px;border:0;padding:13px;resize:vertical;
    font:13px/1.62 ui-monospace,"Cascadia Mono",Consolas,monospace;
    color:var(--ink);background:transparent;direction:ltr;text-align:left;
  }
  textarea:focus{outline:2px solid var(--hit);outline-offset:-2px}

  .ledger{max-height:420px;overflow:auto;padding:4px 0}
  .row{
    display:grid;grid-template-columns:1fr 62px;gap:10px;align-items:baseline;
    padding:7px 13px;border-bottom:1px solid var(--rule-soft);
  }
  .row:last-child{border-bottom:0}
  .row.flagged{background:var(--flag-bg)}
  .row.reftier{background:var(--ref-bg)}
  .short-out .reftier{background:var(--ref-bg);padding:0 2px}
  .row.header-row{background:#f4f7f8}
  .out{direction:rtl;text-align:right;unicode-bidi:plaintext;font-size:14.5px}
  .row.flagged .out{color:var(--flag);direction:ltr;text-align:left}
  .row.header-row .out{color:var(--ink-soft);font-size:13px}
  .yr{
    font:12px ui-monospace,Consolas,monospace;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;text-align:right;
  }
  .src{
    grid-column:1 / -1;font:11px ui-monospace,Consolas,monospace;
    color:var(--ink-soft);opacity:.75;direction:ltr;text-align:left;margin-top:2px;
  }
  .short-out{
    padding:14px 15px;direction:rtl;text-align:right;unicode-bidi:plaintext;
    font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  }
  .short-out .flag{color:var(--flag);background:var(--flag-bg);
    padding:0 3px;direction:ltr;unicode-bidi:isolate}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-soft);font-size:13px}

  button{
    font:inherit;font-size:12.5px;padding:6px 13px;cursor:pointer;
    background:var(--ink);color:#fff;border:1px solid var(--ink);
  }
  button:hover{background:#25384a}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  button.ghost:hover{background:#eef2f4}
  button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
  button:disabled{opacity:.4;cursor:not-allowed}
  #btnMode[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  #btnShort[aria-pressed="true"]{background:var(--hit);border-color:var(--hit)}
  #btnShort[aria-pressed="false"]{background:transparent;color:var(--ink);
    border-color:var(--rule)}

  .opts{
    display:flex;flex-wrap:wrap;gap:18px;align-items:center;
    margin:0 0 20px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--rule);font-size:12.5px;
  }
  .opts label{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
  select{font:inherit;font-size:12.5px;padding:3px 6px;
    border:1px solid var(--rule);background:#fff;color:var(--ink)}
  .opts .spacer{flex:1}

  .missing{margin-top:26px;border:1px solid var(--flag-rule);background:var(--surface)}
  .missing .panel-head{background:var(--flag-bg);border-bottom-color:var(--flag-rule)}
  .missing .panel-title{color:var(--flag)}
  .sect-label{
    padding:9px 13px 5px;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;font-weight:600;color:var(--ink-soft);
    background:#f4f7f8;border-bottom:1px solid var(--rule-soft);
  }
  .miss-row{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
    gap:10px;align-items:center;padding:8px 13px;
    border-bottom:1px solid var(--rule-soft);
  }
  .miss-row:last-child{border-bottom:0}
  .miss-row.added{background:var(--hit-bg)}
  .miss-row.added .miss-en{color:var(--hit)}
  .miss-en{font:12.5px ui-monospace,Consolas,monospace;
    direction:ltr;text-align:left;word-break:break-word}
  .miss-row input{
    font:inherit;font-size:14px;padding:5px 8px;width:100%;
    border:1px solid var(--rule);direction:rtl;text-align:right;
  }
  .miss-row input:focus{outline:2px solid var(--flag);outline-offset:-1px}
  .miss-foot{
    padding:11px 13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    border-top:1px solid var(--flag-rule);background:var(--flag-bg);
    font-size:12px;color:var(--flag);
  }
  .miss-foot .spacer{flex:1}

  .tools{margin-top:26px;border:1px solid var(--rule);background:var(--surface)}
  .tool-body{padding:12px 13px}
  .searchrow{display:flex;gap:9px;align-items:center;margin-bottom:10px}
  .searchrow input[type="search"]{
    flex:1;font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--rule);
  }
  .searchrow input[type="search"]:focus{outline:2px solid var(--hit);outline-offset:-1px}
  .gloss-list{max-height:330px;overflow:auto;border:1px solid var(--rule-soft)}
  .g-row{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
    gap:10px;align-items:center;padding:6px 10px;
    border-bottom:1px solid var(--rule-soft);
  }
  .g-row:last-child{border-bottom:0}
  .g-row.dirty{background:var(--hit-bg)}
  .g-en{font:12px ui-monospace,Consolas,monospace;direction:ltr;text-align:left;
    word-break:break-word}
  .g-row.dirty .g-en{color:var(--hit)}
  .g-row input{
    font:inherit;font-size:13.5px;padding:4px 7px;width:100%;
    border:1px solid var(--rule);direction:rtl;text-align:right;
  }
  .g-row input:focus{outline:2px solid var(--hit);outline-offset:-1px}
  .g-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);white-space:nowrap}
  .tool-foot{
    padding:11px 13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    border-top:1px solid var(--rule);background:#f4f7f8;font-size:12px;
    color:var(--ink-soft);
  }
  .tool-foot .spacer{flex:1}
  .chunkwrap{padding:12px 13px;border-top:1px solid var(--rule)}
  .chunkwrap textarea{
    min-height:150px;font:12px/1.5 ui-monospace,Consolas,monospace;
    border:1px solid var(--rule);background:#fbfcfd;direction:ltr;text-align:left;
  }
  .chunk-hint{font-size:12px;color:var(--ink-soft);margin:0 0 8px}
  .loaderr{
    margin:0 0 18px;padding:11px 14px;font-size:13px;
    background:#fdecea;border:1px solid #d98b82;color:#8a2a1d;
  }
  .loaderr code{font:12px ui-monospace,Consolas,monospace}
  .note{
    font-size:12px;color:var(--ink-soft);margin-top:26px;
    padding-top:14px;border-top:1px solid var(--rule);max-width:70ch;
  }
  .toast{
    position:fixed;bottom:22px;left:50%;
    transform:translateX(-50%) translateY(70px);
    background:var(--ink);color:#fff;padding:9px 18px;font-size:13px;
    transition:transform .22s ease;pointer-events:none;z-index:20;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <span class="seg-label" id="lblLang">Language</span>
  <div class="seg" role="group">
    <button id="langEn" aria-pressed="true">English</button>
    <button id="langHe" aria-pressed="false">עברית</button>
  </div>
  <span class="spacer"></span>
  <span class="seg-label" id="lblMode">Mode</span>
  <div class="seg" role="group">
    <button id="modeUser" aria-pressed="true">User</button>
    <button id="modeAdmin" aria-pressed="false">Admin</button>
  </div>
</div>

<header>
  <span class="mark"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g fill="currentColor"><circle cx="34" cy="32" r="8"/><circle cx="66" cy="32" r="8"/><circle cx="30" cy="29" r="1" fill="white"/><circle cx="63" cy="29" r="1" fill="white"/><polygon points="50 58 55 49 45 49"/><path d="M82,58V17c-0.04,0.009-0.09,0.02-0.1,0.03c-2,0.3-2,0.8-4,1V26c-1-3-3-5-6-6c-1,0.6-2,1-3,2c4,1,7,5,7,10c0,5-4,10-10,10c-4,0-7-2-8-5c-0.4,1-0.8,2-1,4c2,3,6,4,9,4c5,0,9-3,11-7v20c0,15-12,27-27,27s-27-12-27-27V39c2,3,6,6,11,6c4,0,7-2,9-4c-0.3-1-0.6-2-1-4c-2,3-5,5-8,5c-5,0-10-4-10-10c0-5,3-8,7-10c-1-0.8-2-1-3-2c-2,1-4,3-5,4v-7c-1-0.5-3-0.9-4-1v41c0,15,10,27,24,30H24v4h53v-4H58C72,85,82,72,82,58z"/><path d="M89,8c-3,0-6,0.3-9,0.9c-15,3-26,14-30,28c-0.6-2-1-4-2-6C43,20,32,11,20,9c-3-0.6-6-0.9-9-0.9v4c3,0,5,0.3,8,0.8c13,3,23,12,27,24c1,4,2,7,2,11h0.7h3h0.7c0-17,12-31,28-35c3-0.6,5-0.8,8-0.8V8z"/></g></svg></span>
  <span class="eyebrow" id="txtEyebrow">Offline tool</span>
  <h1 id="txtTitle">Problem list converter</h1>
</header>
<p class="sub" id="txtSub"></p>

<div class="meter" hidden id="meterWrap">
  <div class="meter-bar">
    <div class="meter-hit" id="meterHit" style="width:0"></div>
    <div class="meter-ref" id="meterRef" style="width:0"></div>
    <div class="meter-flag" id="meterFlag" style="width:0"></div>
  </div>
  <div class="meter-legend">
    <span><i class="swatch" style="background:var(--hit)"></i><span id="lgHit"></span> <b id="statHit">0</b></span>
    <span><i class="swatch" style="background:var(--flag-rule)"></i><span id="lgMiss"></span> <b id="statMiss">0</b></span>
    <span><span id="lgHeb"></span> <b id="statHeb">0</b></span>
    <span><span id="lgGloss"></span> <b id="statGloss">0</b></span>
    <span id="refStat" hidden><i class="swatch" style="background:var(--ref)"></i><span id="lgRef"></span> <b id="statRef">0</b></span>
    <span id="hdrStat" hidden><span id="lgHdr"></span> <b id="statHdr">0</b></span>
  </div>
</div>

<p class="loaderr" id="loadErr" hidden></p>
<p class="userflag" id="userFlag" hidden></p>

<div class="opts">
  <label id="wrapDate"><span id="lblDate"></span>
    <select id="dateStyle">
      <option value="0" selected></option>
      <option value="1"></option>
      <option value="2"></option>
      <option value="3"></option>
    </select>
  </label>
  <label id="wrapSort"><span id="lblSort"></span>
    <select id="sortDir">
      <option value="asc" selected></option>
      <option value="desc"></option>
      <option value="none"></option>
    </select>
  </label>
  <label id="wrapSep"><span id="lblSep"></span>
    <select id="sepStyle">
      <option value="tab" selected></option>
      <option value="space"></option>
      <option value="dash"></option>
    </select>
  </label>
  <span class="spacer"></span>
  <button id="btnShort" aria-pressed="true"></button>
  <button class="ghost" id="btnClear"></button>
</div>

<div class="cols">
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title" id="ttlSource"></span>
      <button class="ghost" id="btnSample"></button>
    </div>
    <textarea id="src" spellcheck="false"></textarea>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title" id="ttlHebrew"></span>
      <button class="ghost" id="btnCopy" disabled></button>
    </div>
    <div class="ledger" id="ledger"></div>
  </div>
</div>

<div class="missing" id="missingPanel" hidden>
  <div class="panel-head">
    <span class="panel-title" id="ttlMissing"></span>
    <span class="panel-title" id="missCount"></span>
  </div>
  <div id="missList"></div>
  <div class="miss-foot">
    <span id="txtMissFoot"></span>
    <span class="spacer"></span>
    <button class="ghost" id="btnApply"></button>
    <button id="btnDownload" disabled></button>
  </div>
</div>

<div class="tools" id="toolsPanel" hidden>
  <div class="panel-head">
    <span class="panel-title" id="ttlTools"></span>
    <span class="panel-title" id="dirtyCount"></span>
  </div>
  <div class="tool-body">
    <div class="searchrow">
      <input type="search" id="glossSearch" autocomplete="off">
      <button class="ghost" id="btnShowChanged"></button>
    </div>
    <div class="gloss-list" id="glossList"></div>
  </div>
  <div class="tool-foot">
    <span id="txtToolFoot"></span>
    <span class="spacer"></span>
    <input type="file" id="fileImport" accept=".txt,text/plain" hidden>
    <button class="ghost" id="btnImport"></button>
    <button class="ghost" id="btnMode" aria-pressed="false"></button>
    <button class="ghost" id="btnTxt"></button>
    <button id="btnChunk"></button>
  </div>
  <div class="chunkwrap" id="chunkWrap" hidden>
    <p class="chunk-hint" id="txtChunkHint"></p>
    <textarea id="chunkOut" readonly spellcheck="false"></textarea>
    <div style="margin-top:9px"><button id="btnCopyChunk"></button></div>
  </div>
</div>

<p class="note" id="txtNote"></p>

</div>
<div class="toast" id="toast"></div>
<script type="text/plain" id="glossary">
# ===================== BEGIN GLOSSARY =====================
# Replace everything BETWEEN the two marker lines to update.
# Format: ENGLISH<TAB>HEBREW      /      @ENGLISH<TAB>HEBREW for modifiers
# Lines starting with # are comments. Keep the tab separators.
#
# A value of a single hyphen means DROP — the word is left out of the
# output entirely, instead of passing through in English:
#     @NOS<TAB>-              drops "NOS" wherever it trails a term
#     JUNK LINE<TAB>-         drops the whole line
# A line of  -KEY  removes an entry an earlier line defined.
# English<TAB>Hebrew clinical glossary - PATIENT-FACING
# DRAFT - requires clinical review before use.
#
# Style: the Hebrew term a patient is most likely to recognise, with a
# short clarifier in parentheses where the name alone is opaque.
# This is NOT clinical Hebrew - it is plain-language Hebrew.
#
# Format: ENGLISH<TAB>HEBREW          normal term
#         @ENGLISH<TAB>HEBREW         trailing modifier (site, laterality)
#         # ...                       comment
#
# =====================================================================
#  MODIFIERS - laterality, sites, qualifiers
# =====================================================================
@RT	ימין
@LT	שמאל
@RIGHT	ימין
@LEFT	שמאל
@BILATERAL	דו-צדדי
@BILAT	דו-צדדי
@SCALP	בקרקפת

// Accepts a tab, or two-or-more spaces, as the separator — some
// editors silently convert tabs on save.
function parseGlossaryText(txt){
  var lines=txt.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").split("\n");
  var terms={}, mods={}, order=[], n=0, bad=0, dup=0, seen={};

  lines.forEach(function(raw){
    var line=raw.replace(/\s+$/,"");
    var s=line.trim();
    if(!s){ order.push({t:"blank"}); return; }
    if(s.charAt(0)==="#"){ order.push({t:"comment", text:line}); return; }

    // "-KEY" on its own line removes an entry an earlier line defined
    if(s.charAt(0)==="-" && s.indexOf("\t")<0){
      var dk=norm(s.slice(1));
      if(dk){
        if(dk.charAt(0)==="@"){ delete mods[dk.slice(1).trim()]; }
        else { delete terms[dk]; }
        order.push({t:"del", k:dk}); n++;
      }
      return;
    }

    var i=line.indexOf("\t"), k, v, m;
    if(i>=0){ k=line.slice(0,i); v=line.slice(i+1); }
    else if((m=line.match(/^(.*?)\s{2,}(\S.*)$/))){
      k=m[1]; v=m[2];
    }
    else if((m=line.match(/^([^\u0590-\u05FF]*?)\s+([\u0590-\u05FF].*)$/))){
      k=m[1]; v=m[2];          // single space, but the value starts in Hebrew
    }
    else if((m=line.match(/^(.*?)\s+(-)\s*$/))){
      k=m[1]; v=m[2];          // single space before a lone "-" (drop marker)
    }
    else{ bad++; return; }
    k=norm(k); v=v.trim();
    if(!k || !v){ bad++; return; }

    if(k.charAt(0)==="@"){
      k=k.slice(1).trim();
      if(!k){ bad++; return; }
      if(seen["@"+k]) dup++; else seen["@"+k]=1;
      mods[k]=v; order.push({t:"mod", k:k}); n++;
    }else{
      if(seen[k]) dup++; else seen[k]=1;
      terms[k]=v; order.push({t:"term", k:k}); n++;
    }
  });

  return {terms:terms, mods:mods, order:order, count:n, bad:bad, dup:dup};
}

  /\u05D4\u05D9\u05E1\u05D8\u05D5\u05E8\u05D9\u05D4\s+\u05E8\u05E4\u05D5\u05D0\u05D9\u05EA/,
  /^\s*\u05D4\u05E4\u05E0\u05D9\u05D4\s+\u05DB\u05DC\u05DC\u05D9\u05EA/,
  /\u05D4\u05DE\u05E1\u05DE\u05DA\s+\u05DE\u05DB\u05D9\u05DC\s+\u05DE\u05D9\u05D3\u05E2\s+\u05DE\u05D5\u05D2\u05DF/,
  /\u05D4\u05D5\u05D3\u05E4\u05E1\s+\u05E2/,
  /^\s*:?\s*\u05D1\u05E2\u05D9\u05D5\u05EA\s+\u05D9\u05D3\u05D5\u05E2\u05D5\u05EA\s*:?\s*$/,
  /^\s*:?\s*\u05D9\u05D3\u05D5\u05E2\u05D5\u05EA\s+\u05D1\u05E2\u05D9\u05D5\u05EA\s*:?\s*$/
];

function isHeaderLine(line){
  var t=line.trim();
  if(!t) return false;
  for(var i=0;i<HDR_LINES.length;i++) if(HDR_LINES[i].test(t)) return true;
  return false;
}

function stripHeaderBlock(txt){
  var n=0, guard=0;
  while(guard++ < 50){
    var a=txt.search(HDR_START);
    if(a<0) break;
    var rest=txt.slice(a);
    var m=rest.match(HDR_END);
    if(!m) break;                  // no closing heading — leave it alone
    txt = txt.slice(0,a) + rest.slice(m.index + m[0].length);
    n++;
  }
  return {text:txt, count:n};
}

/* ---------- matching ---------- */

// Bidi format characters are invisible and are NOT matched by \s, so a
// stray one pasted into a key would make the entry silently unmatchable.
/* "ADRENAL,BIL" and "ARM/SHOULDER" arrive as a single token, so the
   parts never reach the modifier table. A separator with no space after
   it gets one. */
function norm(s){
  return s.replace(/[\u200E\u200F\u2066-\u2069\uFEFF]/g,"")
          .replace(/([,\/;])(?=\S)/g,"$1 ")
          .trim().toUpperCase().replace(/\s+/g," ");
}

function isMostlyHebrew(s){
  var heb=0, lat=0;
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c>=0x5D0 && c<=0x5EA) heb++;
    else if((c>=65&&c<=90)||(c>=97&&c<=122)) lat++;
  }
  return heb>0 && heb>=lat;
}
var YEAR_MIN=1900;

function fixYMD(d,mo,y){
  var now=new Date().getFullYear();
  var yn=parseInt(y,10);
  if(yn>=YEAR_MIN && yn<=now+1) return {d:d,m:mo,y:y};
  if(y.length===4){
    var mm=parseInt(y.slice(0,2),10), yy=parseInt(y.slice(2),10);
    if(mm>=1 && mm<=12){
      var full = yy > (now % 100) ? 1900+yy : 2000+yy;
      if(full>=YEAR_MIN && full<=now+1){
        return {d:d, m:(mm<10?"0":"")+mm, y:String(full), fixed:true};
      }
    }
  }
  return {d:d,m:mo,y:y};
}
// Accepts dd/mm/yyyy (day may be 00), mm/yyyy, or a bare 4-digit year.
function splitOneDate(t){
  var m = t.match(/(\d{2})\/(\d{2})\/(\d{4})$/), f;
  if(m){
    f=fixYMD(m[1],m[2],m[3]);
    return { body:t.slice(0,m.index).trim(), d:f.d, m:f.m, y:f.y, fixed:f.fixed };
  }
  m = t.match(/(\d{2})\/(\d{4})$/);
  if(m) return { body:t.slice(0,m.index).trim(), d:"00", m:m[1], y:m[2] };
  m = t.match(/(?:^|\s)(\d{4})$/);
  if(m) return { body:t.slice(0,m.index).trim(), d:"00", m:"00", y:m[1] };
  return null;
}

/* Past-problem rows carry two dates — discovery and end. When a second
   one sits behind the first, both are captured and ordered earliest
   first, so the row still sorts by when the problem started. */
/* Some exports put the date in brackets in the middle of the line, with
   free-text detail after it:
       OSTEOARTHRITIS UNS (11/2022) HIP
   The month may be a single digit. Whatever follows the date is real
   content, so it is carried back onto the term and translated with it. */
function splitBracketDate(s){
  var m=s.match(/\((\d{1,2})\/(\d{1,2})\/(\d{4})\)/);
  var d,mo,y;
  if(m){ d=m[1]; mo=m[2]; y=m[3]; }
  else{
    m=s.match(/\((\d{1,2})\/(\d{4})\)/);
    if(!m) return null;
    d="00"; mo=m[1]; y=m[2];
  }
  var pad=function(x){ return x.length<2 ? "0"+x : x; };
  var f=fixYMD(pad(d),pad(mo),y);
  var before=s.slice(0,m.index).trim().replace(/[,;]+$/,"");
  var after=s.slice(m.index+m[0].length).trim().replace(/^[,;]+/,"");
  return { body:(before+" "+after).trim(), d:f.d, m:f.m, y:f.y, fixed:f.fixed };
}

function splitDate(s){
  var a=splitOneDate(s.trim());
  if(!a) return splitBracketDate(s.trim());
  var b=splitOneDate(a.body);
  if(!b) return a;
  var ka=b.y+b.m+b.d, kb=a.y+a.m+a.d;
  var first = ka<=kb ? b : a, second = ka<=kb ? a : b;
  return { body:b.body,
           d:first.d,   m:first.m,   y:first.y,
           d2:second.d, m2:second.m, y2:second.y };
}

function translateModifiers(tail){
  var t=norm(tail), hit=modOf(t);
  if(hit) return hit===DROP ? "" : hit;

  var w=t.split(" "), out=[], i=0;
  while(i<w.length){
    if(i<w.length-1){
      var two=modOf(depunct(w[i])+" "+depunct(w[i+1]));
      if(two){ if(two!==DROP) out.push(two+tailPunct(w[i+1])); i+=2; continue; }
    }
    var core=depunct(w[i]), one=modOf(core);
    if(one){ if(one!==DROP) out.push(one+tailPunct(w[i])); }
    else if(!STOPW[core.toLowerCase()]) out.push(w[i]);   // else silently dropped
    i++;
  }
  return out.join(" ");
}

// Exact match, then longest-prefix match with the remainder mapped
// through the modifier table.
function lookupIn(map,t){ return has(map,t) ? map[t] : ""; }

/* English function words. They never carry meaning in a diagnosis
   string, so they are ignored when building a sorted key and dropped
   from any leftover tail instead of surviving into the Hebrew.
   "with" and "without" are deliberately NOT here — they distinguish
   real clinical opposites. */
var STOPW={};
("of the a an and or in to for on at by is was as from into onto upon per "+
 "following involving complicating affecting due after before during while "+
 "than that which when where about over under between among")
  .split(" ").forEach(function(w){ STOPW[w]=1; });

/* A token carrying attached punctuation ("FRACTURE," ) never matched a
   modifier, so whole tails leaked into the output. Lookups use the bare
   core; any trailing punctuation is re-attached to the translation. */
/* List markers used by different exports. Removed before anything else
   so the first word is not fused with a bullet. */
function stripBullet(line){
  return line.replace(/^[\s\u2022\u00B7\u25E6\u2023\u2043\-\*\+\u2013\u2014]+/,"").trim();
}

function depunct(w){ return w.replace(/^[\("'\[]+|[.,;:!?\)"'\]]+$/g,""); }
function tailPunct(w){ var m=w.match(/[.,;:!?\)"'\]]+$/); return m?m[0]:""; }

/* Order-insensitive key: the same content words in any order produce
   the same string, so "HYPERTENSION ESSENTIAL" finds the entry filed
   as "ESSENTIAL HYPERTENSION". */
function depunctPhrase(t){
  return t.split(" ").map(depunct).filter(Boolean).join(" ");
}

function sortKey(t){
  var w=t.toLowerCase().split(" "), out=[];
  for(var i=0;i<w.length;i++){
    var x=depunct(w[i]);
    if(!x || STOPW[x]) continue;
    out.push(x);
  }
  if(!out.length) return "";
  return out.sort().join(" ");
}

var BSORT=null, USORT=null, RSORT=null;

function buildSort(map){
  var idx=Object.create(null), keys=Object.keys(map);
  for(var i=0;i<keys.length;i++){
    var k=keys[i], v=map[k];
    if(!v) continue;
    var sk=sortKey(k);
    if(sk && !has(idx,sk)) idx[sk]=v;
  }
  return idx;
}
function baseSort(){ if(!BSORT) BSORT=buildSort(BASE); return BSORT; }
function userSort(){ if(!USORT) USORT=buildSort(USER); return USORT; }
function refSort(){ if(!RSORT) RSORT=buildSort(REF); return RSORT; }

/* Curated sorted-key hit, user overrides first. */
function sortedTerm(sk){
  var hit=lookupIn(userSort(),sk);
  if(hit) return hit;
  return lookupIn(baseSort(),sk);
}

/* Lookup order, curated tier then reference tier, each the same way:
     1. exact
     2. sorted content words  (word order ignored)
     3. longest prefix, exact then sorted, remainder through modifiers
   Returns {text, tier} where tier is "" (miss), "gloss" or "ref". */
function glossaryLookup(body){
  var t=norm(body);
  if(!t) return {text:"",tier:""};

  var hit=termOf(t);
  if(hit) return {text:hit,tier:"gloss"};

  hit=sortedTerm(sortKey(t));
  if(hit) return {text:hit,tier:"gloss"};

  var w=t.split(" "), i, head, tail, tt;

  for(i=w.length-1;i>=0;i--){
    head=w.slice(0,i+1).join(" ");
    hit=termOf(head) || termOf(depunctPhrase(head)) || sortedTerm(sortKey(head));
    if(hit){
      if(hit===DROP) return {text:DROP,tier:"gloss"};
      tail=w.slice(i+1).join(" ");
      if(!tail) return {text:hit,tier:"gloss"};
      tt=translateModifiers(tail);
      return {text: tt ? hit+" "+tt : hit, tier:"gloss"};
    }
  }

  if(!REFN) return {text:"",tier:""};

  hit=lookupIn(REF,t) || lookupIn(refSort(),sortKey(t));
  if(hit) return {text:hit,tier:"ref"};

  for(i=w.length-1;i>=0;i--){
    head=w.slice(0,i+1).join(" ");
    hit=lookupIn(REF,head) || lookupIn(REF,depunctPhrase(head)) || lookupIn(refSort(),sortKey(head));
    if(hit){
      tail=w.slice(i+1).join(" ");
      if(!tail) return {text:hit,tier:"ref"};
      tt=translateModifiers(tail);
      return {text: tt ? hit+" "+tt : hit, tier:"ref"};
    }
  }

  return {text:"",tier:""};
}

function fmtDate(p, style){
  if(!p || style==="3") return "";
  function one(d,m,y){
    if(style==="1") return d+"/"+m+"/"+y;
    if(style==="2") return m+"/"+y;
    return y;
  }
  var a=one(p.d,p.m,p.y);
  if(!p.y2) return a;
  var b=one(p.d2,p.m2,p.y2);
  return a===b ? a : a+"-"+b;
}

/* ---------- convert + render ---------- */

var lastHdr=0;

function convert(){
  var pre=stripHeaderBlock($("src").value);
  var raw=pre.text;
  lastHdr=pre.count;
  var style=$("dateStyle").value, dir=$("sortDir").value;
  var lines=raw.replace(/\r\n?/g,"\n").split("\n");
  var rows=[];

  lines.forEach(function(line,idx){
    var s=stripBullet(line.replace(/\t/g," "));
    if(isHeaderLine(s)){ lastHdr++; return; }
    var p=splitDate(s);
    var body = p ? p.body : s;
    var row={ idx:idx, body:body, date:p, key:p?(p.y+p.m+p.d):"", kind:"blank", out:"" };
    if(!body){ rows.push(row); return; }
    if(isMostlyHebrew(body)){ row.kind="hebrew"; row.out=body; }
    else{
      var r=glossaryLookup(body);
      if(r.text===DROP){ row.kind="drop"; row.out=""; }
      else if(r.text){ row.kind = r.tier==="ref" ? "ref" : "hit"; row.out=r.text; }
      else { row.kind="miss"; row.out=body; }
    }
    rows.push(row);
  });

  if(dir!=="none"){
    var sign = dir==="asc" ? 1 : -1;
    rows = rows.map(function(r,i){ return [r,i]; })
      .sort(function(a,b){
        var ra=a[0], rb=b[0];
        if(!ra.date && !rb.date) return a[1]-b[1];
        if(!ra.date) return -1;
        if(!rb.date) return 1;
        if(ra.key===rb.key) return a[1]-b[1];
        return ra.key<rb.key ? -sign : sign;
      })
      .map(function(x){ return x[0]; });
  }

  rows.forEach(function(r){ r.dateOut = fmtDate(r.date, style); });
  lastRows=rows;
  render(rows);
}

function sepChar(){
  var v=$("sepStyle").value;
  return v==="space" ? " " : (v==="dash" ? " — " : "\t");
}

// Undated lines keep their own lines; dated items run together with
// ", ". A year prints only on the LAST item of each same-year run.
function buildShort(rows){
  var live=rows.filter(function(r){ return r.out; });
  var head=[], body=[];
  live.forEach(function(r,i){
    if(!r.dateOut){
      if(!body.length) head.push({text:r.out, kind:r.kind});
      else body.push({text:r.out, kind:r.kind, year:""});
      return;
    }
    var nxt=null;
    for(var j=i+1;j<live.length;j++){ if(live[j].dateOut){ nxt=live[j]; break; } }
    var keep = !nxt || nxt.dateOut!==r.dateOut;
    body.push({text:r.out, kind:r.kind, year: keep ? r.dateOut : ""});
  });
  return {head:head, body:body};
}

// The date is introduced with "ב-" so it reads as Hebrew prose rather
// than a bare column, and the RLM keeps the separator inside the
// right-to-left run when this is pasted into a left-to-right document.
function shortText(rows){
  var s=buildShort(rows);
  var lines=s.head.map(function(h){ return h.text; });
  var run=s.body.map(function(b){
    return b.year ? b.text+RLM+" "+DATEPFX+b.year : b.text;
  }).join(", ");
  if(run) lines.push(run);
  return lines.join("\n");
}

function plainText(rows){
  if(shortMode) return shortText(rows);
  return rows.map(function(r){
    if(!r.out) return "";
    return r.dateOut ? r.out+RLM+sepChar()+DATEPFX+r.dateOut : r.out;
  }).join("\n");
}

function render(rows){
  var led=$("ledger");
  led.textContent="";
  var hit=0,miss=0,heb=0,nref=0, misses=[];

  var refs=[];
  rows.forEach(function(r){
    if(r.kind==="hit") hit++;
    else if(r.kind==="ref"){ nref++; if(refs.indexOf(r.body)<0) refs.push(r.body); }
    else if(r.kind==="miss"){ miss++; if(misses.indexOf(r.body)<0) misses.push(r.body); }
    else if(r.kind==="hebrew") heb++;
  });

  if(shortMode) renderShort(rows,led); else renderLines(rows,led);
  if(!led.children.length){
    var e=document.createElement("div");
    e.className="empty"; e.textContent=T("empty");
    led.appendChild(e);
  }

  var total=hit+nref+miss+heb;
  $("meterWrap").hidden = (total===0 || mode!=="admin");
  $("meterHit").style.width  = total ? (hit/total*100)+"%" : "0";
  $("meterRef").style.width  = total ? (nref/total*100)+"%" : "0";
  $("meterFlag").style.width = total ? (miss/total*100)+"%" : "0";
  $("statHit").textContent=hit;
  $("refStat").hidden = !(mode==="admin" && REFN>0);
  $("statRef").textContent=nref;
  $("statMiss").textContent=miss;
  $("statHeb").textContent=heb;
  $("statGloss").textContent=glossSize();
  $("hdrStat").hidden = !(mode==="admin" && lastHdr>0);
  $("statHdr").textContent=lastHdr;
  $("btnCopy").disabled = total===0;

  var uf=$("userFlag");
  if(mode==="user" && miss>0){
    uf.hidden=false; uf.textContent=T("userFlag").replace("{n}",miss);
  }else uf.hidden=true;

  renderMissing(misses,refs);
  renderGlossary();
}

function renderLines(rows,led){
  rows.forEach(function(r){
    if(!r.out) return;
    var div=document.createElement("div");
    div.className="row" + (r.kind==="miss" ? " flagged" : "") +
                          (r.kind==="ref" ? " reftier" : "") +
                          (r.kind==="hebrew" ? " header-row" : "");
    var o=document.createElement("div");
    o.className="out"; o.textContent=r.out;
    var y=document.createElement("div");
    y.className="yr"; y.textContent=r.dateOut ? DATEPFX+r.dateOut : "";
    div.appendChild(o); div.appendChild(y);
    if(mode==="admin" && (r.kind==="hit"||r.kind==="ref")){
      var s=document.createElement("div");
      s.className="src"; s.textContent=r.body;
      div.appendChild(s);
    }
    led.appendChild(div);
  });
}

function renderShort(rows,led){
  var s=buildShort(rows);
  if(!s.head.length && !s.body.length) return;
  var box=document.createElement("div");
  box.className="short-out";
  s.head.forEach(function(h){
    var d=document.createElement("div");
    d.textContent=h.text; box.appendChild(d);
  });
  var para=document.createElement("div");
  s.body.forEach(function(b,i){
    var span=document.createElement("span");
    if(b.kind==="miss") span.className="flag";
    else if(b.kind==="ref") span.className="reftier";
    span.textContent = b.year ? b.text+" "+DATEPFX+b.year : b.text;
    para.appendChild(span);
    if(i<s.body.length-1) para.appendChild(document.createTextNode(", "));
  });
  box.appendChild(para);
  led.appendChild(box);
}

/* ---------- missing-terms panel ---------- */

function makeMissRow(term,suggest){
  var row=document.createElement("div");
  row.className="miss-row";
  var en=document.createElement("div");
  en.className="miss-en"; en.textContent=term;

  var inp=document.createElement("input");
  inp.type="text"; inp.setAttribute("dir","rtl");
  inp.setAttribute("aria-label",term);
  inp.placeholder=T("hebPlaceholder");
  inp.dataset.term=norm(term);
  inp.value=termOf(norm(term)) || suggest || "";
  inp.addEventListener("input",function(){
    setTerm(this.dataset.term, this.value);
    refreshCounters();
  });
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") applyUser(); });

  var btn=document.createElement("button");
  btn.className="ghost"; btn.textContent=T("copyEn");
  btn.addEventListener("click",function(){ copy(term,T("tTerm")); });

  row.appendChild(en); row.appendChild(inp); row.appendChild(btn);
  return row;
}

function sectionLabel(text){
  var d=document.createElement("div");
  d.className="sect-label"; d.textContent=text;
  return d;
}

function renderMissing(misses,refs){
  var panel=$("missingPanel"), list=$("missList");
  list.textContent="";
  refs=refs||[];
  if(mode!=="admin" || (!misses.length && !refs.length)){ panel.hidden=true; return; }
  panel.hidden=false;

  if(misses.length){
    list.appendChild(sectionLabel(T("pending")+" \u2014 "+misses.length));
    misses.forEach(function(t){ list.appendChild(makeMissRow(t,"")); });
  }
  if(refs.length){
    list.appendChild(sectionLabel(T("fromRef")+" \u2014 "+refs.length));
    refs.forEach(function(t){
      list.appendChild(makeMissRow(t, REF[norm(t)] || glossaryLookup(t).text));
    });
  }

  var bits=[];
  if(misses.length) bits.push(T("missCountA").replace("{a}",misses.length));
  if(refs.length)   bits.push(refs.length+" "+T("fromRef").toLowerCase());
  $("missCount").textContent=bits.join(" \u00b7 ");
}

function applyUser(){
  convert();
  toast(T("tApplied"));
}

/* ---------- glossary workbench ---------- */

function allKeys(){
  var seen={}, out=[];
  Object.keys(BASE).forEach(function(k){ seen[k]=1; out.push({k:k,mod:false}); });
  Object.keys(USER).forEach(function(k){ if(!seen[k]){ seen[k]=1; out.push({k:k,mod:false}); } });
  var seenM={};
  Object.keys(BMOD).forEach(function(k){ seenM[k]=1; out.push({k:k,mod:true}); });
  Object.keys(UMOD).forEach(function(k){ if(!seenM[k]) out.push({k:k,mod:true}); });
  return out;
}

function isDirty(e){ return e.mod ? has(UMOD,e.k) : has(USER,e.k); }
function isNew(e){ return e.mod ? (!has(BMOD,e.k)) : (!has(BASE,e.k)); }
function valOf(e){ return e.mod ? modOf(e.k) : termOf(e.k); }

function renderGlossary(){
  var panel=$("toolsPanel"), list=$("glossList");
  if(mode!=="admin"){ panel.hidden=true; return; }
  panel.hidden=false;

  var q=norm($("glossSearch").value);
  list.textContent="";

  var rows=allKeys().filter(function(e){
    if(showChangedOnly && !isDirty(e)) return false;
    if(!q) return true;
    return e.k.indexOf(q)>=0 || valOf(e).indexOf($("glossSearch").value.trim())>=0;
  });

  // changed entries first, so recent work stays in view
  rows.sort(function(a,b){
    var da=isDirty(a)?0:1, db=isDirty(b)?0:1;
    if(da!==db) return da-db;
    return a.k<b.k ? -1 : (a.k>b.k ? 1 : 0);
  });

  var shown=rows.slice(0,300);
  if(!shown.length){
    var e=document.createElement("div");
    e.className="empty"; e.textContent=T("nores");
    list.appendChild(e);
  }
  shown.forEach(function(e){ list.appendChild(makeGlossRow(e)); });

  refreshCounters();
}

function makeGlossRow(e){
  var row=document.createElement("div");
  row.className="g-row" + (isDirty(e) ? " dirty" : "");

  var en=document.createElement("div");
  en.className="g-en"; en.textContent=(e.mod?"@":"")+e.k;

  var inp=document.createElement("input");
  inp.type="text"; inp.setAttribute("dir","rtl");
  inp.setAttribute("aria-label",e.k);
  inp.value=valOf(e);
  inp.addEventListener("input",function(){
    if(e.mod) setMod(e.k,this.value); else setTerm(e.k,this.value);
    row.className="g-row" + (isDirty(e) ? " dirty" : "");
    tag.textContent=tagFor(e);
    refreshCounters();
  });
  inp.addEventListener("change",function(){ if(lastRows.length) convert(); });

  var tag=document.createElement("span");
  tag.className="g-tag"; tag.textContent=tagFor(e);

  row.appendChild(en); row.appendChild(inp); row.appendChild(tag);
  return row;
}

function tagFor(e){
  if(isNew(e)) return T("tagNew");
  if(isDirty(e)) return T("tagEdit");
  if(e.mod) return T("tagMod");
  return "";
}

function refreshCounters(){
  var n=dirtyCount();
  var txt = n ? T("dirty").replace("{n}",n) : T("clean");
  if(SHADOWED>0) txt += " · " + T("shadow").replace("{n}",SHADOWED);
  $("dirtyCount").textContent = txt;
  $("statGloss").textContent = glossSize();
}

/* ---------- import / export ---------- */

function importText(txt){
  var g=parseGlossaryText(txt);
  if(!g.count){ toast(T("tImpBad")); return; }
  var changed=0;
  Object.keys(g.terms).forEach(function(k){
    var before=has(USER,k)?USER[k]:null;
    setTerm(k,g.terms[k]);
    if((has(USER,k)?USER[k]:null)!==before) changed++;
  });
  Object.keys(g.mods).forEach(function(k){
    var before=has(UMOD,k)?UMOD[k]:null;
    setMod(k,g.mods[k]);
    if((has(UMOD,k)?UMOD[k]:null)!==before) changed++;
  });
  convert();
  toast(changed ? T("tImp").replace("{n}",changed) : T("tImpNone"));
}

function stamp(){
  var d=new Date();
  function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

/* Delta: only what changed this session. Short enough to read before
   pasting, and appended rather than replacing — later lines win. */
function buildDeltaText(){
  var tk=Object.keys(USER).sort(), mk=Object.keys(UMOD).sort();
  var out=[];
  out.push("# ---- update "+stamp()+" — "+(tk.length+mk.length)+" entr(ies) ----");
  mk.forEach(function(k){
    if(UMOD[k]) out.push("@"+k+"\t"+UMOD[k]);
    else        out.push("-@"+k);
  });
  tk.forEach(function(k){
    if(USER[k]) out.push(k+"\t"+USER[k]);
    else        out.push("-"+k);
  });
  return out.join("\n");
}

/* Full: original file order, comments preserved, edits applied in
   place, additions appended. Emits each key once, so pasting this
   folds any accumulated update blocks back into one clean list. */
function buildGlossaryText(){
  var out=[], emitted={}, emittedMod={};

  BORDER.forEach(function(e){
    if(e.t==="comment"){ out.push(e.text); return; }
    if(e.t==="blank"){ out.push(""); return; }
    if(e.t==="del"){ return; }              // resolved at parse time
    if(e.t==="mod"){
      if(emittedMod[e.k]) return;           // a later line already won
      emittedMod[e.k]=1;
      var mv=modOf(e.k);
      if(mv) out.push("@"+e.k+"\t"+mv);
      return;
    }
    if(emitted[e.k]) return;
    emitted[e.k]=1;
    var tv=termOf(e.k);
    if(tv) out.push(e.k+"\t"+tv);
  });

  var newMods=Object.keys(UMOD).filter(function(k){ return UMOD[k] && !emittedMod[k]; });
  var newTerms=Object.keys(USER).filter(function(k){ return USER[k] && !emitted[k]; });

  if(newMods.length || newTerms.length){
    out.push("#");
    out.push("# ---- added "+stamp()+" ----");
    newMods.sort().forEach(function(k){ out.push("@"+k+"\t"+UMOD[k]); });
    newTerms.sort().forEach(function(k){ out.push(k+"\t"+USER[k]); });
  }
  return out.join("\n");
}

function currentText(){
  return exportFull ? buildGlossaryText() : buildDeltaText();
}

function exportTxt(){
  if(!exportFull && !dirtyCount()){ toast(T("tNoChange")); return; }
  var blob=new Blob([currentText()+"\n"],{type:"text/plain;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(exportFull?"glossary_full_":"glossary_update_")+stamp()+".txt";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
  toast(T("tTxt"));
}

function showChunk(){
  if(!exportFull && !dirtyCount()){ toast(T("tNoChange")); return; }
  $("chunkOut").value=currentText();
  $("txtChunkHint").textContent = exportFull ? T("hintFull") : T("hintDelta");
  $("chunkWrap").hidden=false;
  $("chunkOut").focus();
  $("chunkOut").select();
  toast(T("tChunk").replace("{n}",dirtyCount()));
}

function toggleExportMode(){
  exportFull=!exportFull;
  $("btnMode").textContent = exportFull ? T("modeFull") : T("modeDelta");
  $("btnMode").setAttribute("aria-pressed", exportFull?"true":"false");
  if(!$("chunkWrap").hidden) showChunk();
}

/* ---------- clipboard + toast ---------- */

function copy(text,msg){
  var ta=document.createElement("textarea");
  ta.value=text;
  ta.style.cssText="position:fixed;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  ta.remove();
  if(ok){ toast(msg||T("tCopied")); return; }
  if(navigator.clipboard){
    navigator.clipboard.writeText(text)
      .then(function(){ toast(msg||T("tCopied")); })
      .catch(function(){ toast(T("tCopyFail")); });
  }else toast(T("tCopyFail"));
}

var toastTimer;
function toast(msg){
  var t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("show"); },1900);
}

/* ---------- language + mode ---------- */

function setSel(id,keys){
  var sel=$(id);
  for(var i=0;i<sel.options.length;i++) sel.options[i].textContent=T(keys[i]);
}

function setTitle(id,key){
  var el=$(id);
  el.textContent="";
  el.appendChild(document.createTextNode(STR.en[key]));
  var s=document.createElement("span");
  s.className="he-label"; s.textContent=STR.he[key];
  el.appendChild(s);
}

function applyLang(){
  var he = lang==="he";
  document.documentElement.lang = he ? "he" : "en";
  document.documentElement.dir  = he ? "rtl" : "ltr";
  document.title = T("title");

  $("langEn").setAttribute("aria-pressed", he?"false":"true");
  $("langHe").setAttribute("aria-pressed", he?"true":"false");

  $("lblLang").textContent=T("lang");
  $("lblMode").textContent=T("mode");
  $("modeUser").textContent=T("user");
  $("modeAdmin").textContent=T("admin");
  $("txtEyebrow").textContent=T("eyebrow");
  $("txtTitle").textContent=T("title");
  $("txtSub").textContent = mode==="admin" ? T("subAdmin") : T("sub");

  $("lgHit").textContent=T("lgHit");
  $("lgMiss").textContent=T("lgMiss");
  $("lgHeb").textContent=T("lgHeb");
  $("lgGloss").textContent=T("lgGloss");
  $("lgHdr").textContent=T("lgHdr");
  $("lgRef").textContent=T("lgRef");

  $("lblDate").textContent=T("date");
  $("lblSort").textContent=T("sort");
  $("lblSep").textContent=T("sep");
  setSel("dateStyle",["d0","d1","d2","d3"]);
  setSel("sortDir",["s0","s1","s2"]);
  setSel("sepStyle",["p0","p1","p2"]);

  $("btnShort").textContent=T("short");
  $("btnClear").textContent=T("clear");
  $("btnSample").textContent=T("sample");
  $("btnCopy").textContent=T("copy");
  $("src").placeholder=T("placeholder");

  setTitle("ttlSource","source");
  setTitle("ttlHebrew","hebrew");
  $("ttlMissing").textContent=T("missing");
  $("btnApply").textContent=T("apply");
  $("txtMissFoot").textContent=T("missFoot");

  $("ttlTools").textContent=T("tools");
  $("glossSearch").placeholder=T("searchPh");
  $("btnShowChanged").textContent = showChangedOnly ? T("showAll") : T("showChanged");
  $("txtToolFoot").textContent=T("toolFoot");
  $("btnImport").textContent=T("imp");
  $("btnTxt").textContent=T("txt");
  $("btnChunk").textContent=T("chunk");
  $("btnMode").textContent = exportFull ? T("modeFull") : T("modeDelta");
  $("btnCopyChunk").textContent=T("copyChunk");

  $("txtNote").textContent=T("note");

  var le=$("loadErr");
  if(loadError){
    le.hidden=false;
    le.textContent = loadError==="missing" ? T("errMissing") : T("errEmpty");
  }else le.hidden=true;

  refreshCounters();
}

function applyMode(){
  var admin = mode==="admin";
  $("modeUser").setAttribute("aria-pressed", admin?"false":"true");
  $("modeAdmin").setAttribute("aria-pressed", admin?"true":"false");
  $("wrapDate").hidden = !admin;
  $("wrapSort").hidden = !admin;
  $("wrapSep").hidden  = !admin;
  $("btnSample").hidden = !admin;
  $("txtSub").textContent = admin ? T("subAdmin") : T("sub");
  if(!admin){ $("chunkWrap").hidden=true; }
  syncSepState();
}

function syncSepState(){ $("sepStyle").disabled = shortMode; }

/* ---------- events ---------- */

var convertTimer;
function convertSoon(){
  clearTimeout(convertTimer);
  convertTimer=setTimeout(convert,140);
}

function clearAll(){
  $("src").value="";
  lastRows=[];
  $("ledger").textContent="";
  var e=document.createElement("div");
  e.className="empty"; e.textContent=T("empty");
  $("ledger").appendChild(e);
  $("meterWrap").hidden=true;
  $("hdrStat").hidden=true;
  $("refStat").hidden=true;
  lastHdr=0;
  $("userFlag").hidden=true;
  $("btnCopy").disabled=true;
  renderMissing([]);
  renderGlossary();
  $("src").focus();
}

$("langEn").addEventListener("click",function(){
  lang="en"; applyLang(); if(lastRows.length) render(lastRows); else renderGlossary();
});
$("langHe").addEventListener("click",function(){
  lang="he"; applyLang(); if(lastRows.length) render(lastRows); else renderGlossary();
});
$("modeUser").addEventListener("click",function(){
  mode="user"; applyMode(); applyLang();
  if(lastRows.length) render(lastRows); else renderGlossary();
});
$("modeAdmin").addEventListener("click",function(){
  mode="admin"; applyMode(); applyLang();
  if(lastRows.length) render(lastRows); else renderGlossary();
});

$("btnApply").addEventListener("click",applyUser);
$("btnClear").addEventListener("click",function(){ clearAll(); toast(T("tCleared")); });
$("btnCopy").addEventListener("click",function(){ copy(plainText(lastRows),T("tHeb")); });
$("btnSample").addEventListener("click",function(){ $("src").value=SAMPLE; convert(); });
$("btnShort").addEventListener("click",function(){
  shortMode=!shortMode;
  this.setAttribute("aria-pressed", shortMode?"true":"false");
  syncSepState();
  if(lastRows.length) render(lastRows);
});

$("btnShowChanged").addEventListener("click",function(){
  showChangedOnly=!showChangedOnly;
  this.textContent = showChangedOnly ? T("showAll") : T("showChanged");
  renderGlossary();
});
var searchTimer;
$("glossSearch").addEventListener("input",function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(renderGlossary,140);
});

$("btnMode").addEventListener("click",toggleExportMode);
$("btnTxt").addEventListener("click",exportTxt);
$("btnChunk").addEventListener("click",showChunk);
$("btnCopyChunk").addEventListener("click",function(){
  copy($("chunkOut").value,T("tCopied"));
});
$("btnImport").addEventListener("click",function(){ $("fileImport").click(); });
$("fileImport").addEventListener("change",function(){
  var f=this.files && this.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){ importText(String(fr.result)); };
  fr.onerror=function(){ toast(T("tImpBad")); };
  fr.readAsText(f,"utf-8");
  this.value="";
});

["input","paste","cut","drop"].forEach(function(ev){
  $("src").addEventListener(ev,convertSoon);
});
["dateStyle","sortDir","sepStyle"].forEach(function(id){
  $(id).addEventListener("change",convert);
});

window.addEventListener("beforeunload",function(e){
  if(dirtyCount()>0){ e.preventDefault(); e.returnValue=""; }
});

loadEmbedded();
loadReference();
applyMode();
applyLang();
clearAll();
$("toast").classList.remove("show");
})();
</script>
</body>
